<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10243a"><meta name="description" content="LUMEN: la biblioteca a portata di mano. Catalogo, prestiti, prenotazioni e acquisti.">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/lumen.svg" type="image/svg+xml">
<title>LUMEN · La tua biblioteca</title><link rel="stylesheet" href="/style.css">
</head><body>
<a class="skip" href="#main">Vai al contenuto</a>
<div id="root"><header class="shell"><strong>LUMEN</strong></header><main id="main" class="shell"><p>Caricamento biblioteca…</p></main></div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<dialog id="lumen-dialog" class="lumen-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-detail">
  <div class="dialog-content">
    <h2 id="dialog-title">Conferma operazione</h2>
    <p id="dialog-detail">Verifica prima di proseguire.</p>
    <form method="dialog" class="dialog-actions">
      <button class="btn ghost" value="cancel" type="submit">Torna indietro</button>
      <button class="btn" value="confirm" type="submit" id="dialog-confirm">Conferma</button>
    </form>
  </div>
</dialog>
<script type="module" src="/app.js"></script>
</body></html>
