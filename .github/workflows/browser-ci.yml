name: R9 Browser Acceptance
on:
  push:
    branches: [main, feat/lumen-r9-browser-e2e]
    paths:
      - 'browser/**'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-ci.yml'
  pull_request:
    paths:
      - 'browser/**'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-ci.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install LUMEN exactly
        run: npm ci
      - name: Install isolated browser test dependencies
        run: npm --prefix browser ci
      - name: Install pinned Chromium and Linux libraries
        run: npm --prefix browser exec -- playwright install --with-deps chromium
      - name: Actual desktop and Android-emulated browser journeys
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/lumen-browser-acceptance.log
      - name: Expose falsification diagnostics in PR #9
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### R9 real-browser falsification · ${{ github.sha }}'; echo '~~~text'; tail -n 110 /tmp/lumen-browser-acceptance.log 2>/dev/null || true; echo '~~~'; } > /tmp/r9-diagnostics.md
          gh pr comment 9 --body-file /tmp/r9-diagnostics.md
      - name: Save failing browser trace and screenshot evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-r9-browser-failure
          path: |
            browser/test-results/
            browser/playwright-report/
          retention-days: 7
