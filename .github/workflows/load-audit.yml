name: R2 load evidence (synthetic)
on:
  push:
    branches: [feat/lumen-runtime-r2]
    paths:
      - 'src/**'
      - 'perf/**'
      - 'scripts/seed-load.mjs'
      - 'scripts/audit-load.mjs'
      - '.github/workflows/load-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  load-2000:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      LUMEN_DEMO: '0'
      LUMEN_DB_PATH: ./data/load.sqlite
      LOAD_USERS: '2000'
      LOAD_BOOKS: '20000'
      LOAD_HOLD_SECONDS: '20'
      TARGET_URL: http://127.0.0.1:3000
      PORT: '3000'
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/seed-load.mjs
      - name: Start actual LUMEN server
        run: |
          node src/server.mjs > /tmp/lumen-load-server.log 2>&1 &
          echo $! > /tmp/lumen-load-server.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lumen-load-server.log
          exit 1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'
      - name: 2000 concurrent synthetic patron sessions
        run: |
          set -o pipefail
          k6 run perf/library.k6.js 2>&1 | tee perf/k6-run.log
      - name: Publish measured experiment output in PR 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f perf/k6-run.log; then
            {
              echo '### k6 2000 VUs · commit ${{ github.sha }}'
              echo ''
              echo '```text'
              tail -n 95 perf/k6-run.log
              echo '```'
            } > perf/k6-report.md
            gh pr comment 2 --body-file perf/k6-report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-load-evidence-${{ github.sha }}
          path: |
            perf/evidence.json
            perf/k6-run.log
            /tmp/lumen-load-server.log
          if-no-files-found: warn

  write-2000:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      LUMEN_DEMO: '0'
      LUMEN_DB_PATH: ./data/load-writes.sqlite
      LOAD_USERS: '2000'
      LOAD_BOOKS: '20000'
      TARGET_URL: http://127.0.0.1:3000
      PORT: '3000'
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/seed-load.mjs
      - name: Start actual server for concurrent holds
        run: |
          node src/server.mjs > /tmp/lumen-write-server.log 2>&1 &
          echo $! > /tmp/lumen-write-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lumen-write-server.log
          exit 1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'
      - name: Exercise 2000 concurrent session writes and idempotent replay
        run: |
          set -o pipefail
          k6 run perf/write.k6.js 2>&1 | tee perf/write-run.log
      - name: Audit state after concurrent mutations
        if: always()
        run: node scripts/audit-load.mjs | tee perf/write-audit.log
      - name: Publish write saturation evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Mixed write saturation · ${{ github.sha }}'
            echo '~~~text'
            tail -n 42 perf/write-run.log 2>/dev/null || true
            tail -n 22 perf/write-audit.log 2>/dev/null || true
            echo '~~~'
          } > perf/write-report.md
          gh pr comment 2 --body-file perf/write-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-write-evidence-${{ github.sha }}
          path: |
            perf/write-evidence.json
            perf/write-run.log
            perf/write-audit.log
