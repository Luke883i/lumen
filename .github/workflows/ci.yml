name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run preflight
      - name: Domain, HTTP and Koha contract tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/lumen-test.log
      - name: Post R9b test diagnostics on failures
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### R9b CI test assertions · ${{ github.sha }}'; echo '~~~text'; tail -n 180 /tmp/lumen-test.log 2>/dev/null || true; echo '~~~'; } > /tmp/lumen-r9b-errors.md
          gh pr comment 10 --body-file /tmp/lumen-r9b-errors.md
      - name: Render release contract
        run: npm run verify:deploy
      - name: Clean Codespaces and npm start runtime journeys
        run: npm run verify:boot
