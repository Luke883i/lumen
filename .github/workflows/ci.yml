name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Syntax check with diagnostic capture
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/lumen-check.log
      - name: Report syntax failures to invoking PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          { echo '### Syntax CI check diagnostics · ${{ github.sha }}'; echo '~~~text'; tail -n 65 /tmp/lumen-check.log 2>/dev/null || true; echo '~~~'; } > /tmp/ux-s2-check.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/ux-s2-check.md
      - name: License provenance and locked SPDX inventory
        run: npm run check:licenses
      - run: npm run preflight
      - name: Domain, HTTP and Koha contract tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/lumen-test.log
      - name: Report test failures to invoking PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          { echo '### Domain CI test assertions · ${{ github.sha }}'; echo '~~~text'; tail -n 180 /tmp/lumen-test.log 2>/dev/null || true; echo '~~~'; } > /tmp/lumen-r9b-errors.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/lumen-r9b-errors.md
      - name: Render release contract
        run: npm run verify:deploy
      - name: Clean Codespaces and npm start runtime journeys
        run: npm run verify:boot
