name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run preflight
      - name: Domain, HTTP and Koha contract tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/lumen-test.log
      - name: Render release contract
        run: npm run verify:deploy
      - name: Clean Codespaces and npm start runtime journeys
        run: npm run verify:boot
