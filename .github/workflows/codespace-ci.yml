name: Verify Codespaces Node image
on:
  push:
    branches: [main, feat/lumen-r7-boot-render-release]
    paths:
      - '.devcontainer/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/doctor.sh'
      - 'scripts/verify-boot.mjs'
      - '.github/workflows/codespace-ci.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/doctor.sh'
      - 'scripts/verify-boot.mjs'
      - '.github/workflows/codespace-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Codespaces image, post-create bootstrap and terminal boot
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace mcr.microsoft.com/devcontainers/javascript-node:24-bookworm bash -lc 'bash scripts/bootstrap.sh && npm run verify:boot'
