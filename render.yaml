# LUMEN standalone pilot, single-instance persistent SQLite (not HA / 2k certified)
services:
  - type: web
    name: lumen-library
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    disk:
      name: lumen-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: LUMEN_DEMO
        value: '0'
      - key: LUMEN_DB_PATH
        value: /var/data/lumen.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
